
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Priyanshu Yadav | College Notes</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #070b22;
    color: white;
    overflow-x: hidden;
}

.page {
    min-height: 100vh;
    position: relative;
    overflow: hidden;
    background: radial-gradient(circle at top, #25205d, #070b22 70%);
}

header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 22px 8%;
    position: relative;
    z-index: 5;
}

.logo {
    font-size: 22px;
    font-weight: bold;
    color: #fff;
    border: 2px solid #ff9d00;
    padding: 10px 14px;
    border-radius: 12px;
    box-shadow: 0 0 18px #ff6500;
}

.logo span {
    color: #ff9d00;
}

.tag {
    color: #c7c8ff;
    font-size: 14px;
}

.content {
    min-height: 75vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 30px 15px 70px;
    position: relative;
    z-index: 2;
}

.small-title {
    color: #ffbd59;
    letter-spacing: 5px;
    font-size: 13px;
    margin-bottom: 24px;
}

h1 {
    font-size: clamp(35px, 7vw, 76px);
    font-weight: 900;
    letter-spacing: 2px;
    min-height: 1.3em;
    text-shadow: 0 0 20px #9d48ff;
    overflow-wrap: anywhere;
}

.letter {
    display: inline-block;
    opacity: 0;
    animation: appear 0.3s forwards;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(25px);
        color: #ff5c00;
        text-shadow: 0 0 25px #ff2400;
    }
    to {
        opacity: 1;
        transform: translateY(0);
        color: #ffffff;
        text-shadow: 0 0 15px #9d48ff;
    }
}

.fire-line {
    width: 180px;
    height: 4px;
    margin: 20px auto;
    background: linear-gradient(90deg, #ff2400, #ffcc00, #ff4500);
    border-radius: 100%;
    box-shadow: 0 0 12px #ff4500, 0 0 30px #ff9d00;
    animation: fire 0.8s infinite alternate;
}

@keyframes fire {
    from { transform: scaleX(0.8); opacity: 0.65; }
    to { transform: scaleX(1.2); opacity: 1; }
}

.subtitle {
    color: #d1d4ff;
    font-size: 17px;
    margin: 10px 0 28px;
    line-height: 1.7;
}

button {
    padding: 15px 28px;
    background: linear-gradient(90deg, #ff6a00, #ee0979);
    color: white;
    border: none;
    border-radius: 30px;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
    box-shadow: 0 0 22px #ff4c68;
    transition: transform 0.3s;
}

button:hover {
    transform: scale(1.07);
}

.bird {
    position: absolute;
    color: #dce5ff;
    font-size: 25px;
    opacity: 0.7;
    animation: fly 12s linear infinite;
    z-index: 1;
}

.bird:nth-child(1) { top: 20%; animation-duration: 13s; }
.bird:nth-child(2) { top: 34%; animation-duration: 17s; animation-delay: -5s; }
.bird:nth-child(3) { top: 48%; animation-duration: 15s; animation-delay: -8s; }
.bird:nth-child(4) { top: 65%; animation-duration: 19s; animation-delay: -3s; }

@keyframes fly {
    from { left: -10%; transform: translateY(0) scaleX(1); }
    50% { transform: translateY(-35px) scaleX(1); }
    to { left: 110%; transform: translateY(10px) scaleX(1); }
}

.spark {
    position: absolute;
    bottom: -15px;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #ff9d00;
    box-shadow: 0 0 12px #ff4500;
    animation: rise 5s linear infinite;
}

@keyframes rise {
    from { transform: translateY(0); opacity: 1; }
    to { transform: translateY(-100vh); opacity: 0; }
}

.stars {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background-image:
        radial-gradient(2px 2px at 20% 30%, white 50%, transparent),
        radial-gradient(2px 2px at 80% 20%, white 50%, transparent),
        radial-gradient(2px 2px at 65% 70%, white 50%, transparent),
        radial-gradient(2px 2px at 35% 80%, white 50%, transparent);
    background-size: 180px 180px;
    animation: twinkle 4s infinite alternate;
}

@keyframes twinkle {
    from { opacity: 0.3; }
    to { opacity: 0.9; }
}

#notesPage {
    display: none;
    min-height: 100vh;
    padding-bottom: 50px;
}

.notes-content {
    max-width: 850px;
    margin: 45px auto;
    padding: 20px;
    text-align: center;
}

.notes-content h2 {
    font-size: 34px;
    margin: 30px 0 15px;
}

.note-card {
    margin: 25px auto;
    max-width: 500px;
    padding: 25px;
    border: 1px solid #7165dc;
    background: #151638;
    border-radius: 18px;
    box-shadow: 0 0 20px #25205d;
}

.note-card p {
    color: #d1d4ff;
    margin: 15px 0 22px;
}

footer {
    color: #9da4d5;
    font-size: 12px;
    margin-top: 45px;
}

@media (max-width: 600px) {
    header { padding: 18px 5%; }
    .tag { font-size: 11px; }
    .subtitle { font-size: 15px; }
}
</style>
</head>

<body>

<section class="page" id="homePage">

    <div class="stars"></div>

    <div class="bird">⌁</div>
    <div class="bird">⌁</div>
    <div class="bird">⌁</div>
    <div class="bird">⌁</div>

    <header>
        <div class="logo"><span>PY</span> LOGO</div>
        <div class="tag">MY COLLEGE • MY JOURNEY</div>
    </header>

    <main class="content">
        <p class="small-title">WELCOME TO MY WORLD</p>

        <h1 id="animatedName"></h1>

        <div class="fire-line"></div>

        <p class="subtitle">
            Welcome to my study space<br>
            Learn • Practice • Grow
        </p>

        <button onclick="openNotes()">EXPLORE MY NOTES →</button>
    </main>

    <footer style="text-align:center; padding:20px;">
        Designed by Priyanshu Yadav
    </footer>
</section>


<section id="notesPage" class="page">

    <div class="stars"></div>

    <header>
        <div class="logo"><span>PY</span> LOGO</div>
        <button onclick="goHome()">← HOME</button>
    </header>

    <div class="notes-content">
        <p class="small-title">YOUR LEARNING SPACE</p>

        <h2>Priyanshu Yadav</h2>

        <div class="fire-line"></div>

        <p class="subtitle">B.Tech CSE | College Notes</p>

        <div class="note-card">
            <h3>📘 Physics Notes</h3>
            <p>Open your Physics notes PDF here.</p>
            <button onclick="openPhysics()">OPEN PHYSICS PDF</button>
        </div>

        <button onclick="goHome()">BACK TO FIRST PAGE</button>

        <footer>Keep Learning • Keep Growing</footer>
    </div>
</section>


<script>
const name = "Priyanshu Yadav";
const nameBox = document.getElementById("animatedName");

function showName() {
    nameBox.innerHTML = "";

    [...name].forEach((letter, index) => {
        const span = document.createElement("span");
        span.className = "letter";
        span.textContent = letter === " " ? "\u00A0" : letter;
        span.style.animationDelay = (index * 0.18) + "s";
        nameBox.appendChild(span);
    });
}

function openNotes() {
    document.getElementById("homePage").style.display = "none";
    document.getElementById("notesPage").style.display = "block";
    window.scrollTo(0, 0);
}

function goHome() {
    document.getElementById("notesPage").style.display = "none";
    document.getElementById("homePage").style.display = "block";
    showName();
    window.scrollTo(0, 0);
}

function openPhysics() {
    // Change this path to match your actual PDF file.
    window.open("docs/physics.pdf", "_blank");
}

// Create rising fire sparks
for (let i = 0; i < 35; i++) {
    const spark = document.createElement("div");
    spark.className = "spark";
    spark.style.left = Math.random() * 100 + "%";
    spark.style.animationDelay = Math.random() * 5 + "s";
    spark.style.animationDuration = (3 + Math.random() * 4) + "s";
    document.body.appendChild(spark);
}

showName();
</script>

</body>
</html>
